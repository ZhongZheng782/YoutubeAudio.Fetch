name: Update YouTube source settings

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  update-settings:
    if: >-
      startsWith(github.event.issue.title, 'Update source settings: ')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate and apply setting proposal
        id: update
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          title = os.environ["ISSUE_TITLE"]
          body = os.environ.get("ISSUE_BODY") or ""
          match = re.search(r"```json\s*(.*?)\s*```", body, re.S)
          if not match:
              raise SystemExit("Issue body must contain a fenced JSON proposal")
          proposal = json.loads(match.group(1))
          source_id = proposal.get("source_id")
          if not source_id or title != f"Update source settings: {source_id}":
              raise SystemExit("Issue title and source_id do not match")
          if proposal.get("retention") not in {"selected", "all", "latest", "since_date"}:
              raise SystemExit("Invalid retention mode")
          date_after = proposal.get("date_after")
          if proposal["retention"] == "since_date":
              try:
                  date.fromisoformat(date_after or "")
              except (TypeError, ValueError):
                  raise SystemExit("since_date mode requires date_after in YYYY-MM-DD format")
          if proposal.get("processing") not in {"audio_only", "audio_and_frames"}:
              raise SystemExit("Invalid processing mode")
          selected_ids = proposal.get("selected_video_ids", [])
          if not isinstance(selected_ids, list) or any(not re.fullmatch(r"[A-Za-z0-9_-]{11}", x) for x in selected_ids):
              raise SystemExit("selected_video_ids must be YouTube video IDs")

          path = Path("sources.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          source = next((item for item in config["sources"] if item.get("id") == source_id), None)
          if source is None:
              raise SystemExit(f"Unknown source: {source_id}")
          channel_id = proposal.get("channel_id")
          if source.get("type") == "playlist":
              policy = next((item for item in source.setdefault("channel_policies", []) if item.get("channel_id") == channel_id), None)
              videos_for_channel = [video for video in source.get("videos", []) if video.get("channel_id") == channel_id]
              channel_url = proposal.get("channel_url")
              if policy is None:
                  if not channel_id or not channel_url or not videos_for_channel:
                      raise SystemExit(f"Unknown channel in playlist: {channel_id}")
                  if any(video.get("channel_url") and video["channel_url"] != channel_url for video in videos_for_channel):
                      raise SystemExit("channel_url does not match the playlist catalog")
                  policy = {
                      "channel_id": channel_id,
                      "channel_name": videos_for_channel[0].get("channel_name", channel_id),
                      "channel_url": channel_url,
                      "fetch_limit": source.get("fetch_limit", 5),
                      "retention": "selected",
                      "selected_video_ids": [video["video_id"] for video in videos_for_channel],
                      "processing": "audio_and_frames",
                  }
                  source["channel_policies"].append(policy)
              channel_url = policy["channel_url"]
              channel_videos = videos_for_channel
          else:
              policy = source
              channel_url = source["url"]
              channel_videos = []
          if proposal["retention"] == "selected":
              available = {video.get("video_id") for video in channel_videos}
              manifest = json.loads(Path("audio_manifest.json").read_text(encoding="utf-8"))
              metadata_path = Path("data/.video_metadata.json")
              metadata = json.loads(metadata_path.read_text(encoding="utf-8")) if metadata_path.exists() else {}
              available.update(
                  stem[-11:] for stem in manifest
                  if stem[:-12] == source["channel_dir"]
                  and (source.get("type") != "playlist" or metadata.get(stem[-11:], {}).get("channel_url") == channel_url)
              )
              if not selected_ids or not set(selected_ids) <= available:
                  raise SystemExit("Selected videos must exist in this source's catalog")
          if proposal["retention"] == "selected":
              policy["selected_video_ids"] = list(dict.fromkeys(selected_ids))
          policy["retention"] = proposal["retention"]
          if proposal["retention"] == "since_date":
              policy["date_after"] = date_after
          else:
              policy.pop("date_after", None)
          policy["processing"] = proposal["processing"]
          path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update source settings from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Close processed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "設定已更新並提交至 sources.json。"
          gh workflow run "Daily channel fetch" --ref main
