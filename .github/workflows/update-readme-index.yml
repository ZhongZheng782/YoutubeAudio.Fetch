name: Update README content index

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*_keyframes.md'
      - 'scripts/generate_readme_index.py'
      - 'playlists.json'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Install Node (yt-dlp JS challenge runtime)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Regenerate README content index
        run: uv run python scripts/generate_readme_index.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/.video_metadata.json data/*/README.md
          git diff --cached --quiet || git commit -m "chore: refresh README content index [skip ci]"
          git push
