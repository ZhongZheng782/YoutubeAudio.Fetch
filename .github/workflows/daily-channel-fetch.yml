name: Daily channel fetch

on:
  schedule:
    - cron: "0 23 * * *"  # ~07:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      limit:
        description: "Newest videos to consider per channel"
        default: "5"

jobs:
  fetch:
    # Runs on the ZhongZheng782 org's self-hosted NAS runner (wenchiehlee.quickconnect.to)
    # instead of a GitHub-hosted runner: GitHub-hosted runners' datacenter IPs are reliably
    # flagged by YouTube's bot detection ("Sign in to confirm you're not a bot"), even with
    # valid cookies — a residential IP passes cleanly without needing cookies at all.
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install fetch dependencies
        # ffmpeg is needed here already, not just for keyframe extraction later:
        # channel_fetch.py's yt-dlp call uses `-x --audio-format m4a`, which shells
        # out to ffmpeg for post-processing.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install requests python-dotenv yt-dlp youtube-transcript-api

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 -d > youtube-cookies.txt
            chmod 600 youtube-cookies.txt
            echo "YOUTUBE_COOKIES_FILE=$PWD/youtube-cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Fetch each tracked channel
        env:
          WHISPER_SOURCE_REPO: ZhongZheng782/YoutubeAudio.Fetch
          WHISPER_TARGET_REPO: ZhongZheng782/Mac-mini
          WHISPER_SOURCE_TYPE: youtube
          REPO_FILE_SYNC_WENCHIEHLEE_MONEY: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
          REPO_FILE_SYNC_ZHONGZHENG782_MONEY: ${{ secrets.REPO_FILE_SYNC_ZHONGZHENG782_MONEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          for url in $(python -c "import json; print('\n'.join(json.load(open('channels.json'))))"); do
            echo "::group::$url"
            python skills/skill-youtube-channel-fetch/scripts/channel_fetch.py fetch "$url" --limit "$LIMIT" --sync || echo "::warning::fetch failed for $url"
            echo "::endgroup::"
          done

      - name: Commit fetch outputs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ audio_manifest.json
          git diff --cached --quiet || git commit -m "chore: daily channel fetch sources [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Install keyframe-extraction dependencies
        timeout-minutes: 10
        # ffmpeg is already installed in "Install fetch dependencies" above. Only
        # skill-youtube-channel-srt-keyframe-extract needs these pip packages — not
        # `pip install -r requirements.txt`, whose `-e ../llm` only resolves on a dev
        # machine with the sibling llm repo checked out locally. In CI, install the
        # same package straight from GitHub instead.
        # --force-reinstall --no-deps: this is a persistent self-hosted runner (unlike a
        # GitHub-hosted one, its site-packages survive between runs), and a bare `pip
        # install pkg @ git+URL` without --upgrade/--force-reinstall silently keeps
        # whatever commit was already installed — confirmed live when a fix pushed to
        # wenchiehlee/llm didn't take effect on the very next run.
        run: pip install --force-reinstall --no-deps Pillow "llm @ git+https://github.com/wenchiehlee/llm.git"

      - name: Extract keyframes for videos missing a _keyframes.md
        env:
          # GeminiProvider (../llm) round-robins across GEMINI_API_KEY plus any
          # GEMINI_API_KEY_1..N, permanently skipping ones that come back invalid
          # or daily-quota-exhausted — mirrors the key pool in GoogleAlertManager/.env.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          CODEX_API_URL: ${{ secrets.CODEX_API_URL }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          python - <<'PYEOF'
          import subprocess
          import sys
          from pathlib import Path

          # A stem is "ready to extract keyframes from" once it has EITHER a FIN.srt
          # (whisper-pipeline-scored) or, absent that, a GT.srt on its own (sourced
          # directly from an official YouTube manual transcript — channel_fetch.py
          # doesn't write a FIN.srt for those unless/until `refine` is run). Prefer
          # FIN.srt as the source when both exist.
          srt_by_stem = {}
          for gt in sorted(Path("data").glob("*/*_GT.srt")):
              srt_by_stem[gt.name[: -len("_GT.srt")]] = gt
          for fin in sorted(Path("data").glob("*/*_FIN.srt")):
              srt_by_stem[fin.name[: -len("_FIN.srt")]] = fin

          for stem, srt in sorted(srt_by_stem.items()):
              md_path = srt.with_name(f"{stem}_keyframes.md")
              if md_path.exists():
                  continue
              # YouTube video IDs are a fixed 11 chars (can themselves contain "_"),
              # so slice by width rather than rsplit("_", 1) — the latter truncated
              # IDs like "rTnPsm_gAhA" or "_FsaTDrvsms" down to a broken short ID.
              video_id = stem[-11:]
              video_url = f"https://www.youtube.com/watch?v={video_id}"
              print(f"::group::{stem}")
              ok = False
              for attempt in range(2):
                  proc = subprocess.run([
                      sys.executable,
                      "skills/skill-youtube-channel-srt-keyframe-extract/scripts/keyframe_extract.py",
                      "extract", stem, "--srt", str(srt), "--video-url", video_url,
                  ])
                  if proc.returncode == 0:
                      ok = True
                      break
                  print(f"attempt {attempt + 1} failed for {stem}")
              if not ok:
                  # YouTube's anti-bot throttling is intermittent (seen repeatedly in
                  # manual testing) — leave it for tomorrow's run rather than fail the job.
                  print(f"::warning::keyframe extraction failed for {stem} after retries, will retry on next run")
              print("::endgroup::")
          PYEOF

      - name: Regenerate README content index
        run: python scripts/generate_readme_index.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ audio_manifest.json README.md
          git diff --cached --quiet || git commit -m "chore: daily channel fetch [skip ci]"
          git pull --rebase --autostash
          git push
