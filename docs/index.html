<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YoutubeAudio.Fetch</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f8;
    --panel: #ffffff;
    --panel-raised: #f4f1ef;
    --border: #e8e2df;
    --text: #332b2d;
    --muted: #766d6d;
    --accent: #a83245;
    --accent-bright: #bd3d50;
    --gold: #ad792d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background:
      radial-gradient(ellipse at 78% 0%, rgba(168, 50, 69, .08), transparent 38rem),
      var(--bg);
    color: var(--text);
  }
  header {
    padding: 26px clamp(20px, 4vw, 56px) 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(250, 249, 248, .9);
    position: relative;
    z-index: 2;
  }
  header h1 { margin: 0 0 7px; font-size: clamp(22px, 2.4vw, 30px); letter-spacing: -.04em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
  a { color: var(--gold); text-decoration-color: rgba(173, 121, 45, .4); text-underline-offset: 3px; }
  a:hover { color: var(--accent); }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 21px;
  }
  .tab-group { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .tab-group-title { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin: 0 3px 0 0; }
  .tab {
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    background: rgba(255,255,255,.72);
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  .tab:hover { border-color: var(--gold); color: var(--text); }
  .tab.active { background: linear-gradient(135deg, #963044, #bd3d50); border-color: var(--accent-bright); color: #fff; box-shadow: 0 5px 20px rgba(168,50,69,.16); }
  .layout {
    display: grid;
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
    min-height: calc(100vh - 160px);
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px clamp(16px, 3vw, 42px) 42px;
    gap: 24px;
  }
  @media (max-width: 800px) {
    header { padding: 22px 18px 18px; }
    .tab-group { width: 100%; }
    .tab-group-title { width: 100%; margin: 6px 0 1px; }
    .layout { grid-template-columns: 1fr; padding: 16px 14px 28px; gap: 16px; }
    .episode-list { max-height: 38vh !important; }
    .main { padding: 20px 16px !important; }
  }
  .episode-list {
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow-y: auto;
    max-height: calc(100vh - 205px);
    background: rgba(255,255,255,.84);
    box-shadow: 0 12px 36px rgba(59,38,36,.045);
    scrollbar-color: #c9b7b0 transparent;
  }
  .episode {
    padding: 15px 17px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .18s ease, border-color .18s ease;
  }
  .episode:last-child { border-bottom: 0; }
  .episode:hover { background: var(--panel-raised); }
  .episode.active { background: linear-gradient(90deg, rgba(168,50,69,.1), rgba(255,255,255,.65)); border-left-color: var(--accent-bright); }
  .episode .meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .episode .date { color: var(--gold); font-size: 11px; letter-spacing: .04em; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: .02em;
    vertical-align: middle;
  }
  .badge-phase-3 { background: rgba(173, 121, 45, .15); color: #8c5d1e; border: 1px solid rgba(173, 121, 45, .3); }
  .badge-phase-2 { background: rgba(50, 115, 168, .12); color: #226499; border: 1px solid rgba(50, 115, 168, .28); }
  .badge-phase-1 { background: rgba(168, 50, 69, .1); color: #a83245; border: 1px solid rgba(168, 50, 69, .25); }
  .badge-phase-0 { background: rgba(118, 109, 109, .12); color: #5a5353; border: 1px solid rgba(118, 109, 109, .25); }
  .phase-banner {
    padding: 14px 18px;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid transparent;
  }
  .phase-banner.phase-2 {
    background: rgba(50, 115, 168, .08);
    border-color: rgba(50, 115, 168, .25);
    color: #1a4f78;
  }
  .phase-banner.phase-1 {
    background: rgba(168, 50, 69, .08);
    border-color: rgba(168, 50, 69, .25);
    color: #852233;
  }
  .phase-banner .phase-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .phase-banner .phase-desc { font-size: 13px; line-height: 1.6; opacity: .9; }
  .video-description {
    padding: 16px 20px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .02);
    border: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-line;
    color: var(--muted);
    margin-top: 15px;
  }
  .episode .title { font-size: 14px; line-height: 1.55; }
  .main { padding: 24px 28px; overflow-y: auto; max-height: calc(100vh - 205px); border: 1px solid var(--border); border-radius: 14px; background: linear-gradient(145deg, #fff, #fdfbfa); box-shadow: 0 12px 36px rgba(59,38,36,.045); scrollbar-color: #c9b7b0 transparent; }
  .main h2 { font-size: clamp(18px, 2vw, 24px) !important; line-height: 1.45; letter-spacing: -.025em; margin-bottom: 18px; }
  .placeholder { color: var(--muted); padding: 40px 0; text-align: center; }
  audio { width: 100%; margin: 0 0 18px; accent-color: var(--accent); }
  .keyframe img {
    width: 100%;
    max-width: 640px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: block;
    margin: 4px auto 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
  }
  .cue-list { display: flex; flex-direction: column; gap: 5px; }
  .cue {
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .18s ease, border-color .18s ease;
  }
  .cue:hover { background: rgba(65,44,42,.035); }
  .cue.active { background: rgba(168,50,69,.075); border-color: rgba(168,50,69,.35); }
  .cue .ts { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .06em; margin-bottom: 5px; }
  .cue .snippet { font-size: 14px; line-height: 1.75; color: var(--text); }
  .cue .topic { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .lyrics-live {
    min-height: 58px;
    margin: 0 0 20px;
    padding: 15px 18px;
    border: 1px solid rgba(173,121,45,.2);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    background: linear-gradient(110deg, rgba(173,121,45,.07), rgba(255,255,255,.82));
    font-size: 18px;
    line-height: 1.7;
    white-space: pre-line;
  }
  .lyrics-live.empty { color: var(--muted); font-size: 14px; }
  .loading { color: var(--muted); padding: 20px; text-align: center; }
  /* UX-Deck Unified Brand Bar & Whale Mascot */
  .yaf-brand-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px clamp(16px, 3.5vw, 42px);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .yaf-brand-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
  }
  .yaf-mascot-glow {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(139, 92, 246, 0.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .yaf-brand-badge:hover .yaf-mascot-glow {
    transform: translateY(-1px) scale(1.05);
    box-shadow: 0 5px 14px rgba(139, 92, 246, 0.45);
  }
  .yaf-whale-icon {
    width: 22px;
    height: 22px;
    color: #ffffff;
  }
  .yaf-brand-text { display: flex; flex-direction: column; }
  .yaf-brand-title { font-size: 15px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .yaf-brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
  .yaf-top-nav { display: flex; align-items: center; gap: 8px; }
  .yaf-nav-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--border);
    background: #ffffff;
    color: #444;
    transition: all .18s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .yaf-nav-pill:hover {
    border-color: #8b5cf6;
    color: #8b5cf6;
    background: rgba(139, 92, 246, .08);
    transform: translateY(-1px);
    text-decoration: none;
  }
  .yaf-nav-pill-github {
    background: #18181f;
    color: #ffffff !important;
    border-color: #18181f;
  }
  .yaf-nav-pill-github:hover {
    background: #2b2b36;
    border-color: #2b2b36;
    box-shadow: 0 3px 10px rgba(24, 24, 31, .3);
  }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
</style>

<header>
  <h1>YoutubeAudio.Fetch</h1>
  <p>資料即時讀自 YoutubeAudio.Fetch 這個 repo（jsDelivr CDN），僅列出已有音檔的集數 ·
    <a id="feedLink" href="feed.xml" style="color:var(--accent)">在 Podcast App 訂閱全部頻道（RSS）</a>
  </p>
  <div class="tabs" id="tabs"></div>
</header>
<div class="layout">
  <div class="episode-list" id="episodeList">
    <div class="loading">載入集數清單中…</div>
  </div>
  <div class="main" id="main">
    <div class="placeholder">請從左邊選一集</div>
  </div>
</div>
<script>
const REPO_BASE = "https://cdn.jsdelivr.net/gh/ZhongZheng782/YoutubeAudio.Fetch@main/";
const PAGES_BASE = "https://zhongzheng782.github.io/YoutubeAudio.Fetch/";
const VIDEO_ID_LEN = 11;
const CHANNEL_GROUPS = [
  {
    label: "Daily",
    channels: ["ai-note-101", "fubonsec", "jimainotebook", "smartmonthly-bw", "wealth1974", "x", "yutinghaofinance"],
  },
  { label: "Playlist", channels: ["themarketmemo"] },
];
const CHANNEL_DISPLAY_NAMES = { themarketmemo: "Youtube.Fetch" };

const tabsEl = document.getElementById("tabs");
const episodeListEl = document.getElementById("episodeList");
const mainEl = document.getElementById("main");
const feedLinkEl = document.getElementById("feedLink");

let manifest = {};
let metaCache = {};
let playlistCatalog = [];
let channels = [];
let currentChannel = null;

function timeToSeconds(hhmmss) {
  const [h, m, s] = hhmmss.split(":").map(Number);
  return h * 3600 + m * 60 + s;
}

function channelOf(stem) {
  return stem.slice(0, stem.length - VIDEO_ID_LEN - 1);
}

function parseKeyframesMd(md, channel, stem) {
  const cues = [];
  const re = /## (\d{2}:\d{2}:\d{2})\s*\n\s*<img src="([^"]+)"[^>]*>\s*\n\s*\*\*逐字稿片段：\*\* ([^\n]*)\s*\n\s*\*\*話題推測：\*\* ([^\n]*)/g;
  let match;
  while ((match = re.exec(md)) !== null) {
    cues.push({
      time: timeToSeconds(match[1]),
      timeLabel: match[1],
      img: `${REPO_BASE}data/${channel}/${match[2]}`,
      snippet: match[3].trim(),
      topic: match[4].trim(),
    });
  }
  return cues;
}

function parseVttCues(vtt) {
  const lines = vtt.replace(/\r\n/g, "\n").split("\n");
  const cues = [];
  const timeRe = /(\d{2}):(\d{2}):(\d{2})\.(\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})\.(\d{3})/;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(timeRe);
    if (m) {
      const h = Number(m[1]), min = Number(m[2]), s = Number(m[3]);
      const secs = h * 3600 + min * 60 + s;
      const label = `${m[1]}:${m[2]}:${m[3]}`;
      let snippet = "";
      let j = i + 1;
      while (j < lines.length && lines[j].trim() && !lines[j].includes("-->")) {
        snippet += (snippet ? " " : "") + lines[j].trim();
        j++;
      }
      if (snippet) cues.push({ time: secs, timeLabel: label, snippet, topic: "" });
      i = j - 1;
    }
  }
  return cues;
}

function parseDescriptionChapters(desc) {
  const cues = [];
  const lines = (desc || "").split("\n");
  const re = /(?:^|\s)(?:(\d{1,2}):)?(\d{2}):(\d{2})\s+([^\n\r]+)/;
  for (const line of lines) {
    const m = line.trim().match(re);
    if (m) {
      let secs = 0;
      let label = "";
      if (m[1] !== undefined) {
        secs = Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3]);
        label = `${m[1].padStart(2, "0")}:${m[2]}:${m[3]}`;
      } else {
        secs = Number(m[2]) * 60 + Number(m[3]);
        label = `00:${m[2]}:${m[3]}`;
      }
      cues.push({ time: secs, timeLabel: label, snippet: m[4].trim(), topic: "影片章節" });
    }
  }
  return cues;
}

async function fetchJson(path) {
  const url = REPO_BASE + path + (path.endsWith(".json") ? `?v=${Date.now().toString(36)}` : "");
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

async function fetchText(path) {
  const res = await fetch(REPO_BASE + path);
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.text();
}

function displayNameFor(channel) {
  if (CHANNEL_DISPLAY_NAMES[channel]) return CHANNEL_DISPLAY_NAMES[channel];
  for (const stem of Object.keys(manifest)) {
    if (channelOf(stem) !== channel) continue;
    const videoId = stem.slice(channel.length + 1);
    const name = (metaCache[videoId] || {}).channel_name;
    if (name) return name;
  }
  return channel;
}

function renderTabs() {
  tabsEl.innerHTML = "";
  CHANNEL_GROUPS.forEach((group) => {
    const groupEl = document.createElement("div");
    groupEl.className = "tab-group";
    const titleEl = document.createElement("div");
    titleEl.className = "tab-group-title";
    titleEl.textContent = group.label;
    groupEl.appendChild(titleEl);
    group.channels.filter((channel) => channels.includes(channel)).forEach((channel) => {
      const el = document.createElement("div");
      el.className = "tab" + (channel === currentChannel ? " active" : "");
      el.textContent = displayNameFor(channel);
      el.addEventListener("click", () => selectChannel(channel));
      groupEl.appendChild(el);
    });
    if (groupEl.children.length > 1) tabsEl.appendChild(groupEl);
  });
}

function selectChannel(channel) {
  currentChannel = channel;
  const url = new URL(window.location.href);
  url.searchParams.set("channel", channel);
  window.history.replaceState(null, "", url);

  // The public UI intentionally exposes one subscription for every channel.
  // Per-channel feeds remain available at /{channel}/feed.xml for direct use.
  feedLinkEl.href = `${PAGES_BASE}/feed.xml`;
  renderTabs();

  const audioEpisodes = Object.keys(manifest)
    .filter((stem) => channelOf(stem) === channel)
    .map((stem) => {
      const videoId = stem.slice(channel.length + 1);
      const meta = metaCache[videoId] || {};
      return {
        stem,
        videoId,
        audioUrl: manifest[stem],
        title: meta.title || stem,
        date: meta.date || "",
        phase: meta.phase !== undefined ? meta.phase : 1,
        description: meta.description || "",
      };
    });
  const playlistEpisodes = playlistCatalog
    .filter((playlist) => playlist.channel_dir === channel)
    .flatMap((playlist) => playlist.videos || [])
    .map((video) => {
      const stem = `${channel}_${video.video_id}`;
      const meta = metaCache[video.video_id] || {};
      return {
        stem,
        videoId: video.video_id,
        audioUrl: manifest[stem] || "",
        title: video.title || video.video_id,
        date: video.date || "",
        phase: manifest[stem] ? (meta.phase !== undefined ? meta.phase : 1) : 0,
        description: meta.description || "",
        youtubeUrl: `https://www.youtube.com/watch?v=${video.video_id}`,
      };
    });
  const episodes = [...new Map([...audioEpisodes, ...playlistEpisodes].map((episode) => [episode.stem, episode])).values()]
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  renderEpisodeList(channel, episodes);
  mainEl.innerHTML = `<div class="placeholder">請從左邊選一集</div>`;
  const requestedEpisode = new URL(window.location.href).searchParams.get("episode");
  const selectedEpisode = episodes.find((episode) => episode.stem === requestedEpisode) || episodes[0];
  if (selectedEpisode) selectEpisode(channel, selectedEpisode);
}

async function loadChannels() {
  [manifest, metaCache] = await Promise.all([
    fetchJson("audio_manifest.json"),
    fetchJson("data/.video_metadata.json").catch(() => ({})),
  ]);
  playlistCatalog = await fetchJson("playlists.json").catch(() => []);

  const manifestChannels = Object.keys(manifest).map(channelOf);
  channels = [...new Set([...manifestChannels, ...CHANNEL_GROUPS.flatMap((group) => group.channels)])].sort();
  if (channels.length === 0) {
    episodeListEl.innerHTML = `<div class="loading">目前沒有任何有音檔的集數</div>`;
    return;
  }

  const requested = new URL(window.location.href).searchParams.get("channel");
  const initial = channels.includes(requested)
    ? requested
    : (channels.includes("yutinghaofinance") ? "yutinghaofinance" : channels[0]);
  selectChannel(initial);
}

function getBadge(phase, hasAudio) {
  if (phase === 3) return `<span class="badge badge-phase-3">✨ 圖文</span>`;
  if (phase === 2) return `<span class="badge badge-phase-2">📝 逐字稿</span>`;
  if (phase === 1 || hasAudio) return `<span class="badge badge-phase-1">🎙️ 音訊</span>`;
  return `<span class="badge badge-phase-0">📺 YouTube</span>`;
}

function renderEpisodeList(channel, episodes) {
  episodeListEl.innerHTML = "";
  episodes.forEach((ep) => {
    const el = document.createElement("div");
    el.className = "episode";
    el.dataset.stem = ep.stem;
    el.innerHTML = `
      <div class="meta-row">
        <span class="date">${ep.date || "日期未知"}</span>
        ${getBadge(ep.phase, !!ep.audioUrl)}
      </div>
      <div class="title">${ep.title}</div>
    `;
    el.addEventListener("click", () => selectEpisode(channel, ep));
    episodeListEl.appendChild(el);
  });
}

function setActiveEpisode(stem) {
  document.querySelectorAll(".episode").forEach((el) => {
    el.classList.toggle("active", el.dataset.stem === stem);
  });
}

async function selectEpisode(channel, ep) {
  setActiveEpisode(ep.stem);
  const audioMarkup = ep.audioUrl
    ? `<audio id="player" controls src="${ep.audioUrl}">
        <track id="lyricsTrack" kind="subtitles" srclang="zh-TW" label="逐字稿" src="${PAGES_BASE}${channel}/transcripts/${ep.stem}.vtt">
      </audio>`
    : `<p class="placeholder">這支 Playlist 影片的音訊尚未同步。<a href="${ep.youtubeUrl}" target="_blank" rel="noopener" style="color:var(--accent)">在 YouTube 開啟影片</a></p>`;
  mainEl.innerHTML = `
    <h2 style="margin-top:0;font-size:16px;">${ep.title}</h2>
    ${audioMarkup}
    <div id="lyricsLive" class="lyrics-live empty" aria-live="polite">播放後顯示即時逐字稿</div>
    <div class="keyframe" id="keyframe"></div>
    <div class="cue-list" id="cueList"><div class="loading">載入資料中…</div></div>
  `;

  const player = document.getElementById("player");
  const lyricsTrack = document.getElementById("lyricsTrack");
  const lyricsLiveEl = document.getElementById("lyricsLive");
  const keyframeEl = document.getElementById("keyframe");
  const cueListEl = document.getElementById("cueList");

  function updateLiveLyrics() {
    const activeCues = lyricsTrack && lyricsTrack.track && lyricsTrack.track.activeCues;
    const text = activeCues
      ? [...activeCues].map((cue) => cue.text.trim()).filter(Boolean).join("\n")
      : "";
    lyricsLiveEl.textContent = text || "播放後顯示即時逐字稿";
    lyricsLiveEl.classList.toggle("empty", !text);
  }

  if (player && lyricsTrack) {
    lyricsTrack.track.mode = "hidden";
    lyricsTrack.track.addEventListener("cuechange", updateLiveLyrics);
    lyricsTrack.addEventListener("load", updateLiveLyrics);
    player.addEventListener("timeupdate", updateLiveLyrics);
    const requestedTime = Number(new URL(window.location.href).searchParams.get("t"));
    if (Number.isFinite(requestedTime) && requestedTime >= 0) {
      player.addEventListener("loadedmetadata", () => {
        player.currentTime = requestedTime;
        updateLiveLyrics();
      }, { once: true });
    }
  }

  let cues = [];
  let hasKeyframes = false;
  try {
    const md = await fetchText(`data/${channel}/${ep.stem}_keyframes.md`);
    cues = parseKeyframesMd(md, channel, ep.stem);
    hasKeyframes = cues.length > 0;
  } catch (_) {}

  if (hasKeyframes) {
    keyframeEl.innerHTML = "";
    cueListEl.innerHTML = "";
    cues.forEach((cue, i) => {
      const el = document.createElement("div");
      el.className = "cue";
      el.dataset.index = i;
      el.innerHTML = `
        <div class="ts">${cue.timeLabel}</div>
        <div class="snippet">${cue.snippet}</div>
        <div class="topic">${cue.topic}</div>
      `;
      el.addEventListener("click", () => {
        if (player) {
          player.currentTime = cue.time;
          player.play();
        }
      });
      cueListEl.appendChild(el);
    });
  } else {
    // Keyframes not ready: check for VTT transcript (Phase 2)
    let vttText = null;
    try {
      const res = await fetch(`${PAGES_BASE}${channel}/transcripts/${ep.stem}.vtt`);
      if (res.ok) vttText = await res.text();
    } catch (_) {}

    if (vttText && vttText.includes("-->")) {
      keyframeEl.innerHTML = `
        <div class="phase-banner phase-2">
          <div class="phase-title">📝 全文逐字稿已就緒 · 關鍵圖表分析中</div>
          <div class="phase-desc">本集已完成高精度語音轉譯，播放時上方會顯示同步即時逐字稿。關鍵圖表畫面目前正在非同步分析提取中。</div>
        </div>
      `;
      cues = parseVttCues(vttText);
      cueListEl.innerHTML = "";
      cues.forEach((cue, i) => {
        const el = document.createElement("div");
        el.className = "cue";
        el.dataset.index = i;
        el.innerHTML = `
          <div class="ts">${cue.timeLabel}</div>
          <div class="snippet">${cue.snippet}</div>
        `;
        el.addEventListener("click", () => {
          if (player) {
            player.currentTime = cue.time;
            player.play();
          }
        });
        cueListEl.appendChild(el);
      });
    } else {
      // Phase 1 (Audio only) or Phase 0 (External)
      const chapters = parseDescriptionChapters(ep.description);
      if (ep.audioUrl) {
        keyframeEl.innerHTML = `
          <div class="phase-banner phase-1">
            <div class="phase-title">🎙️ 音訊已就緒 · 逐字稿轉譯處理中</div>
            <div class="phase-desc">本集音訊已發布，音檔可正常播放。逐字稿與關鍵畫面正在非同步轉譯管線中排程處理。</div>
          </div>
        `;
      } else {
        keyframeEl.innerHTML = "";
      }

      cueListEl.innerHTML = "";
      if (chapters.length > 0) {
        cues = chapters;
        chapters.forEach((cue, i) => {
          const el = document.createElement("div");
          el.className = "cue";
          el.dataset.index = i;
          el.innerHTML = `
            <div class="ts">${cue.timeLabel}</div>
            <div class="snippet">${cue.snippet}</div>
            <div class="topic">影片章節</div>
          `;
          el.addEventListener("click", () => {
            if (player) {
              player.currentTime = cue.time;
              player.play();
            }
          });
          cueListEl.appendChild(el);
        });
      }

      if (ep.description) {
        const descEl = document.createElement("div");
        descEl.className = "video-description";
        descEl.textContent = ep.description;
        cueListEl.appendChild(descEl);
      } else if (chapters.length === 0) {
        cueListEl.innerHTML = `<div class="placeholder">本集逐字稿與關鍵畫面轉譯排程中</div>`;
      }
    }
  }

  function updateActiveCue() {
    if (cues.length === 0 || !player) return;
    const t = player.currentTime;
    let idx = 0;
    for (let i = 0; i < cues.length; i++) {
      if (cues[i].time <= t) idx = i;
      else break;
    }
    document.querySelectorAll(".cue").forEach((el, i) => {
      el.classList.toggle("active", i === idx);
    });
    const active = cues[idx];
    if (active && active.img && keyframeEl.dataset.current !== String(idx)) {
      keyframeEl.dataset.current = String(idx);
      keyframeEl.innerHTML = `<img src="${active.img}" alt="${active.timeLabel}">`;
      const activeEl = cueListEl.children[idx];
      if (activeEl) activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  if (player) {
    player.addEventListener("timeupdate", updateActiveCue);
    player.addEventListener("loadedmetadata", updateActiveCue);
  }
}

loadChannels().catch((e) => {
  episodeListEl.innerHTML = `<div class="loading">載入失敗：${e.message}</div>`;
});
</script>
</body>
</html>
